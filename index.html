<meta name="claude:viewport-fit-sides" content="cover">
<title>백귀타로</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@200;300;400;500&display=swap">
<style>
/* 레이아웃: 한 화면짜리 무대 — 배경 고정, 아래 부채꼴 패, 위쪽은 글이 올라앉는 빈 하늘 */
:root{
  color-scheme: dark;
  --mook:#0a0507;        /* 먹 */
  --mook-2:#160a0c;      /* 먹 옅은 쪽 */
  --jusa:#c0362a;        /* 주사 붉은색 */
  --jusa-hot:#ff5436;    /* 불빛 */
  --geum:#c9a24a;        /* 금 */
  --geum-dim:#8a6f33;
  --jae:#ece0d2;         /* 재 — 본문 */
  --jae-dim:#9b8b7d;     /* 흐린 글 */
  --line:rgba(201,162,74,.28);
  --serif:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --sans:"Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--mook); color:var(--jae);
  font-family:var(--sans); font-weight:300; line-height:1.75;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--geum); outline-offset:3px}

/* ── 무대 ───────────────────────────────── */
#stage{
  position:relative; height:100%; width:100%; max-width:520px; margin:0 auto;
  overflow:hidden; isolation:isolate;
}
#bg{position:absolute; inset:0; z-index:0; background:#070406; overflow:hidden}
#bg .plate{
  position:absolute; inset:0;
  background:#070406 url("img/bg.webp") center bottom/cover no-repeat;
  transition:opacity .7s ease;
}
#bg .plate.seer{
  background-image:url("img/seer.webp");
  background-position:center 14%;
  opacity:0;
}
#bg.seer .plate.night{opacity:0}
#bg.seer .plate.seer{opacity:1}
#bg::after{
  content:""; position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(86% 40% at 50% 6%, rgba(10,5,7,.92) 0%, rgba(10,5,7,.48) 56%, rgba(10,5,7,0) 100%),
    radial-gradient(74% 26% at 50% 47%, rgba(8,4,6,.74), transparent 72%),
    linear-gradient(180deg, rgba(10,5,7,.52) 0%, rgba(10,5,7,.16) 22%, rgba(10,5,7,.56) 58%, rgba(10,5,7,.94) 86%, #0a0507 100%);
}
#bg::before{
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(58% 32% at 50% 44%, rgba(255,84,54,.08), transparent 72%);
}
.screen{
  position:absolute; inset:0; z-index:2; overflow:hidden;
  display:flex; flex-direction:column;
  padding-left:max(22px, env(safe-area-inset-left,0px));
  padding-right:max(22px, env(safe-area-inset-right,0px));
  padding-block:0;
  animation:fade .7s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 머리글 ─────────────────────────────── */
.brand{
  padding-top:calc(8vh + 10px); text-align:center; flex:none;
  transition:opacity .25s, max-height .3s ease, padding-top .3s ease;
  max-height:220px; overflow:hidden;
}
/* 글 쓸 때는 제목을 접어 자리를 내준다 */
.screen.typing .brand{max-height:0; opacity:0; padding-top:0}
.brand .mark{margin:0; line-height:0}
.brand .mark{position:relative}
.brand .mark::before{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:86vw; height:190px; pointer-events:none;
  background:radial-gradient(52% 50% at 50% 50%, rgba(4,2,3,.92), rgba(4,2,3,.55) 58%, transparent 78%);
}
.brand .mark img{
  position:relative; width:min(66vw, 268px); height:auto; display:inline-block;
  filter:brightness(1.5) contrast(1.12)
         drop-shadow(0 0 30px rgba(255,84,54,.55))
         drop-shadow(0 2px 6px #000);
}
.brand .sub{
  margin:15px 0 0; font-family:var(--serif); font-size:12.5px;
  letter-spacing:.26em; color:var(--geum-dim); text-indent:.26em;
}
.brand .echo{
  margin:15px 0 0; font-family:var(--serif); font-size:14px; font-weight:400;
  letter-spacing:0; color:var(--jae-dim); text-indent:0;
  max-width:300px; margin-inline:auto; line-height:1.6;
}
.brand .echo::before{content:"「 "; color:var(--geum-dim)}
.brand .echo::after{content:" 」"; color:var(--geum-dim)}
.rule{width:58px; height:1px; margin:18px auto 0; background:linear-gradient(90deg,transparent,var(--geum-dim),transparent)}

/* ── 들어가기 ───────────────────────────── */
.ask{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; justify-content:center; gap:20px;
  padding-block:10px;
}
.ask::-webkit-scrollbar{width:0}
.ask h2{
  font-family:var(--serif); font-weight:700; font-size:clamp(19px,5.2vw,23px);
  text-align:center; margin:0; color:var(--jae); text-wrap:balance;
  line-height:1.95; letter-spacing:-.012em;
  text-shadow:0 2px 14px #000, 0 0 30px rgba(0,0,0,.85);
}
.field{position:relative}
.field textarea{
  width:100%; min-height:98px; resize:none;
  background:rgba(7,4,5,.88); color:var(--jae);
  border:1px solid var(--line); border-radius:2px;
  padding:16px 16px 34px; font:inherit; font-size:15px; line-height:1.7;
  backdrop-filter:blur(3px);
}
.field textarea::placeholder{color:#978679}
.field textarea:focus{border-color:var(--geum); background:rgba(6,3,4,.94); box-shadow:0 0 0 1px rgba(201,162,74,.3), 0 0 30px rgba(0,0,0,.8)}
.count{position:absolute; right:12px; bottom:10px; font-size:11px; color:#8d7f73; font-variant-numeric:tabular-nums}
.hint{margin:0; font-size:12.5px; font-weight:200; color:#b9aa9c; text-align:center; letter-spacing:.04em; text-shadow:0 2px 12px #000, 0 0 24px #000, 0 0 40px rgba(0,0,0,.95)}

/* ── 단추 ───────────────────────────────── */
.btn{
  display:block; width:100%; padding:16px 18px; border:1px solid var(--geum);
  background:linear-gradient(180deg, rgba(192,54,42,.30), rgba(120,24,18,.46));
  color:var(--jae); font-family:var(--serif); font-weight:700;
  font-size:16px; letter-spacing:.28em; border-radius:2px;
  text-indent:.28em; transition:.22s;
}
.btn:hover{background:linear-gradient(180deg, rgba(222,70,48,.44), rgba(150,30,22,.58)); box-shadow:0 0 28px rgba(255,84,54,.3)}
.btn:disabled{opacity:.62; cursor:default; box-shadow:none; filter:saturate(.5)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--jae-dim); font-weight:400; font-size:13px; letter-spacing:.22em; padding:13px}
.btn.ghost:hover{border-color:var(--geum-dim); color:var(--jae); box-shadow:none}

/* ── 부채꼴 패 ──────────────────────────── */
.fanwrap{
  position:absolute; left:0; right:0; z-index:3; touch-action:none;
  bottom:calc(70px + env(safe-area-inset-bottom,0px)); height:300px;
  perspective:1100px; perspective-origin:50% 120%;
}
.fanwrap::before{
  content:""; position:absolute; left:-10%; right:-10%; bottom:-30px; height:150px;
  background:radial-gradient(60% 100% at 50% 100%, rgba(255,84,54,.20), transparent 72%);
  pointer-events:none;
}
.fan{
  position:absolute; left:50%; bottom:0; width:0; height:0;
  transform-style:preserve-3d;
  transform:rotateX(21deg);
}
.card{
  position:absolute; bottom:0; width:132px; height:198px; margin-left:-66px;
  border-radius:5px; background:#120a0b url("img/back.webp") center/cover no-repeat;
  border:1px solid rgba(201,162,74,.5);
  box-shadow:0 -4px 18px rgba(0,0,0,.72), 0 0 0 1px rgba(0,0,0,.5);
  transform-origin:50% 186%;
  transform:var(--t);
  transition:transform .44s cubic-bezier(.22,1,.36,1), filter .35s, opacity .4s;
  will-change:transform;
}
.card.lift{
  transform:var(--t) translate(0,-46px) scale(1.07);
  filter:brightness(1.5) drop-shadow(0 0 18px rgba(255,84,54,.8));
  transition:transform .15s ease-out, filter .15s;
  z-index:80 !important;
}
.card.brushed{border-color:rgba(255,140,100,.85); box-shadow:0 -4px 18px rgba(0,0,0,.72), 0 0 16px rgba(255,84,54,.3)}
.fan.pickable .card{cursor:pointer}
.fan.pickable .card:hover{
  transform:var(--t) translate(0,-40px);
  filter:brightness(1.4) drop-shadow(0 0 16px rgba(255,84,54,.7));
  z-index:80;
}
.card.taken{
  transform:var(--t) translate(0,-150px) scale(.52) !important;
  opacity:0; pointer-events:none;
  transition:transform .66s cubic-bezier(.3,.85,.3,1), opacity .5s ease-in .12s;
}
.card.nudge{transform:var(--t) translate(0,-15px); transition:transform .2s ease-out}
.card.off{opacity:0; pointer-events:none; transition:opacity .2s}
.fan.spin .card{transition:filter .25s, opacity .2s}

.deal{
  position:absolute; left:0; right:0; z-index:5; margin:0; text-align:center;
  bottom:calc(386px + env(safe-area-inset-bottom,0px));
  font-family:var(--serif); font-size:14px; letter-spacing:.14em; color:var(--jae);
  text-shadow:0 2px 14px #000, 0 0 26px rgba(0,0,0,.9); pointer-events:none;
  transition:opacity .4s;
}
.deal small{display:block; margin-top:7px; font-size:11.5px; font-family:var(--sans);
  font-weight:200; letter-spacing:.06em; color:var(--jae-dim)}
.pips{display:flex; gap:11px; justify-content:center; margin-top:11px}
.pips i{
  width:7px; height:7px; transform:rotate(45deg); border:1px solid var(--geum-dim);
  transition:.3s;
}
.pips i.on{background:var(--jusa-hot); border-color:var(--jusa-hot); box-shadow:0 0 12px rgba(255,84,54,.9)}

/* ── 뽑은 세 장 ─────────────────────────── */
.laid{flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4vh}
.slot{text-align:center}
.slot .pos{
  font-family:var(--serif); font-size:13px; letter-spacing:.2em; color:var(--geum-dim);
  margin-bottom:9px; text-indent:.2em;
}
.flipper{position:relative; width:100%; aspect-ratio:2/3; perspective:900px}
.inner{
  position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.3,.9,.3,1);
}
.flipper.open .inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:4px;
  border:1px solid rgba(201,162,74,.5); overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.66);
}
.face.back{background:#120a0b url("img/back.webp") center/cover no-repeat}
.face.front{
  transform:rotateY(180deg); background:#0d0708;
  display:flex; flex-direction:column;
}
.front .art{
  flex:1; min-height:0; background:#140b0c center/cover no-repeat;
  border-bottom:1px solid rgba(201,162,74,.3);
}
.front.rev .art{transform:rotate(180deg)}
.front .nm{
  flex:none; padding:5px 3px 6px; background:linear-gradient(180deg,#140b0c,#0a0506);
  font-family:var(--serif); font-size:10.5px; line-height:1.35; color:var(--jae);
}
.front .nm small{display:block; font-size:8.5px; color:var(--geum-dim); letter-spacing:.08em; margin-top:1px}
.awake{
  position:absolute; top:5px; left:50%; transform:translateX(-50%); z-index:3;
  font-size:8.5px; letter-spacing:.14em; color:#fff;
  background:rgba(192,54,42,.9); border:1px solid rgba(255,120,90,.8);
  padding:2px 6px; border-radius:1px; text-indent:.14em; white-space:nowrap;
}
.slot.locked .face.back::after{
  content:"封"; position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--serif); font-size:28px; color:rgba(255,84,54,.92);
  background:rgba(6,3,4,.6); text-shadow:0 0 18px rgba(255,84,54,.8);
}

/* ── 풀이 ───────────────────────────────── */
.read{flex:1; min-height:0; overflow-y:auto; margin-top:16px; padding-bottom:18px}
.read::-webkit-scrollbar{width:3px}
.read::-webkit-scrollbar-thumb{background:var(--geum-dim)}
.line{
  margin:0 0 17px; font-size:15.5px; font-weight:300; line-height:2.05;
  color:var(--jae); letter-spacing:-.008em; animation:rise .55s ease both;
}
.line .who{
  display:block; font-family:var(--serif); font-weight:700; font-size:11.5px;
  letter-spacing:.3em; color:var(--jusa-hot); margin-bottom:7px; text-indent:.3em;
}
.caret{
  display:inline-block; width:2px; height:1em; vertical-align:-2px;
  background:var(--jusa-hot); margin-left:2px; animation:blip .9s steps(2) infinite;
}
@keyframes blip{0%,49%{opacity:1}50%,100%{opacity:0}}
.dots{display:inline-block; letter-spacing:.42em; font-size:17px; color:var(--jae-dim)}
.dots i{font-style:normal; animation:fadein 1.5s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.25s}
.dots i:nth-child(3){animation-delay:.5s}
@keyframes fadein{0%,100%{opacity:.2}45%{opacity:1}}
.line em{font-style:normal; color:var(--geum); font-weight:500}
.line strong{color:#ff8a6b; font-weight:500}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.thinking{color:var(--jae-dim); font-size:13px; letter-spacing:.3em}

.seal{
  margin:4px 0 16px; padding:18px 16px; border:1px solid var(--line); border-radius:2px;
  background:rgba(8,4,6,.72); text-align:center; animation:rise .6s ease both;
}
.seal .blur{
  color:var(--jae-dim); font-size:14px; line-height:1.95;
  filter:blur(5px); user-select:none; margin:0 0 14px;
}
.seal .why{font-family:var(--serif); font-size:14.5px; color:var(--jae); margin:0 0 4px}
.seal .price{
  font-family:var(--serif); font-size:12px; color:var(--geum-dim); margin:0 0 14px;
  letter-spacing:.06em;
}
.tail{
  margin:10px 0 0; font-size:12px; color:var(--jae-dim); text-align:center; line-height:1.9;
}
.tail b{color:var(--geum); font-weight:400}

.foot{
  flex:none; position:relative; z-index:8;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-top:10px; display:grid; gap:9px;
}
#s-shuffle .brand .mark img, #s-pick .brand .mark img{width:min(44vw, 176px); opacity:.86}
.demo-tag{
  position:fixed; z-index:9; top:calc(8px + env(safe-area-inset-top,0px));
  left:50%; transform:translateX(-50%);
  font-size:9.5px; letter-spacing:.26em; color:var(--geum-dim);
  border:1px solid var(--line); padding:3px 9px; border-radius:1px;
  background:rgba(6,3,4,.72); text-indent:.26em; pointer-events:none;
}
</style>

<div class="demo-tag">데모판</div>

<div id="stage">
  <div id="bg"><div class="plate night"></div><div class="plate seer"></div></div>

  <!-- 1. 들어가기 -->
  <section class="screen" id="s-ask">
    <div class="brand">
      <h1 class="mark"><img src="img/title.webp" alt="백귀타로"></h1>
      <div class="rule"></div>
    </div>
    <div class="ask" id="askbox">
      <h2>무엇이 궁금하여<br>백 귀신의 패를 열려 하는가</h2>
      <div class="field">
        <textarea id="q" maxlength="120" placeholder="지금 가장 답답한 것 하나만 적어라.&#10;예) 지금 만나는 사람과 끝까지 갈 수 있을까요"></textarea>
        <span class="count" id="count">0 / 120</span>
      </div>
      <p class="hint">생년월일은 묻지 않는다. 질문 하나면 족하다.</p>
    </div>
    <div class="foot">
      <button class="btn" id="go" disabled>패 를 펴 다</button>
    </div>
  </section>

  <!-- 2. 섞기 -->
  <section class="screen" id="s-shuffle" hidden>
    <div class="brand" style="padding-top:calc(5vh + 4px)">
      <h1 class="mark"><img src="img/title.webp" alt="백귀타로"></h1>
    </div>
    <div class="ask"></div>
    <p class="deal" id="dealmsg">패를 손으로 쓸어 흩어라<small>백 귀신이 네 질문을 받아 간다</small></p>
    <div class="fanwrap" id="fanwrap">
      <div class="fan" id="fan"></div>
    </div>
  </section>

  <!-- 3. 뽑기 -->
  <section class="screen" id="s-pick" hidden>
    <div class="brand" style="padding-top:calc(5vh + 4px)">
      <h1 class="mark"><img src="img/title.webp" alt="백귀타로"></h1>
    </div>
    <div class="ask"></div>
    <p class="deal" id="pickmsg">손이 멎는 자리가 네 패다
      <small>인(因) · 연(緣) · 과(果) 세 장</small>
      <span class="pips" id="pips"><i></i><i></i><i></i></span>
    </p>
    <div class="fanwrap" id="fanwrap2">
      <div class="fan pickable" id="fan2"></div>
    </div>
  </section>

  <!-- 4. 풀이 -->
  <section class="screen" id="s-read" hidden>
    <div class="brand" style="padding-top:calc(3.4vh + 4px)">
      <p class="sub" style="margin:0">백귀타로</p>
    </div>
    <div class="laid" id="laid"></div>
    <div class="read" id="read"></div>
    <div class="foot" id="readfoot"></div>
  </section>
</div>

<script>
/* ── 패 (데모용 열 장. 실제는 백 장) ───────────────────────── */
const DECK = [
  { nm:"염마", jp:"엔마", hanja:"閻魔", suit:"대귀", no:"제일귀", el:"화", art:"img/oni.webp",
    因:"네 일이 막힌 뿌리는 네 선택이 아니다. 심판의 귀가 뒤에 서 있다. 네가 전에 끊지 못하고 어물쩍 넘긴 일 하나가, 지금 전부를 붙잡고 있다.",
    緣:"지금 네 둘레에 저울이 놓여 있다. 너를 재고 있는 사람이 있고, 그 사람은 이미 결론을 냈다. 네가 모르고 있을 뿐이다.",
    果:"어물쩍 넘어가는 결말은 없다. 둘 중 하나로 딱 갈린다. 반반은 없다.",
    why:"네가 끝내지 않고 미뤄둔 일이 있기 때문이다. 염마는 미룬 자를 따라붙는 귀다. 매듭을 안 지었으니 매듭이 너를 지은 것이다.",
    fix:"미뤄둔 것 하나를 이번 달 안에 끝내라. 작은 것이라도 좋다. 끝냈다는 사실 자체가 이 귀를 떨어뜨린다." },

  { nm:"백귀야행", jp:"햐쿠키야교", hanja:"百鬼夜行", suit:"대귀", no:"제삼귀", el:"수", art:"img/moon.webp",
    因:"하나가 아니다. 여럿이 겹쳐서 이렇게 됐다. 네가 한 가지 원인만 붙들고 고치려 했으니 안 풀린 것이다.",
    緣:"지금 네 주변이 통째로 움직이는 때다. 사람이 몰려들고 말도 몰려든다. 이 소란 속에서 네 것과 남의 것이 섞인다.",
    果:"혼자 조용히 끝나지 않는다. 남들이 다 보는 자리에서 결판난다.",
    why:"네가 너무 많은 문을 열어뒀기 때문이다. 아무나 드나드는 집에는 귀도 섞여 든다. 지금 네 곁에 있는 사람 수부터 줄여야 한다.",
    fix:"사람을 쳐내라. 셋만 남기고 거리를 둬라. 소란이 가라앉으면 네 것이 뭔지 보인다." },

/* ── 상태 ───────────────────────────────── */
const S = { q:"", order:[], picked:[], shuffles:0, swept:new Set(), paid:false, E:null, spin:0, done:false, brushN:0, pass:0, dir:0, sinceFlip:0 };
const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s => s.hidden = true);
  $(id).hidden = false;
};

/* ── 1. 질문 ────────────────────────────── */
const q = $("q");
q.addEventListener("focus", () => $("s-ask").classList.add("typing"));
q.addEventListener("blur", () => $("s-ask").classList.remove("typing"));
q.addEventListener("input", () => {
  $("count").textContent = q.value.length + " / 120";
  $("go").disabled = q.value.trim().length < 2;
});
$("go").addEventListener("click", () => {
  S.q = q.value.trim();
  S.order = [];
  while(S.order.length < WHEEL) S.order.push(...DECK.map((_, i) => i));
  for(let i = S.order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [S.order[i], S.order[j]] = [S.order[j], S.order[i]];
  }
  buildFan($("fan"), false);
  $("bg").classList.add("seer");
  show("s-shuffle");
});

/* ── 패 바퀴 — 눈에는 부채, 속으로는 원 ──── */
const WHEEL = 60;              /* 끊김 없이 도는 패 */
const STEP  = 360 / WHEEL;

function norm(a){ return ((a + 180) % 360 + 360) % 360 - 180; }
function cardAngle(i){ return norm(i * STEP + (S.spin || 0)); }
function fanTransform(i){ return `rotate(${cardAngle(i).toFixed(2)}deg)`; }

let spinQueued = false;
function applySpin(host){
  if(spinQueued) return;
  spinQueued = true;
  requestAnimationFrame(() => {
    spinQueued = false;
    const cards = host.children;
    for(let i = 0; i < cards.length; i++){
      const a = cardAngle(i), c = cards[i];
      c.style.setProperty("--t", `rotate(${a.toFixed(2)}deg)`);
      const off = Math.abs(a) > 52;
      if((c.dataset.off === "1") !== off){
        c.dataset.off = off ? "1" : "0";
        c.classList.toggle("off", off);
      }
      c.style.zIndex = String(120 - Math.round(Math.abs(a)));
    }
  });
}

function buildFan(host, pickable){
  host.innerHTML = "";
  for(let i = 0; i < WHEEL; i++){
    const c = document.createElement("div");
    c.className = "card";
    c.style.setProperty("--t", fanTransform(i));
    c.dataset.i = i;
    if(pickable){
      c.setAttribute("role", "button");
      c.setAttribute("tabindex", "0");
      c.setAttribute("aria-label", "패 뽑기");
      c.addEventListener("click", () => pick(c));
      c.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(c); }
      });
    }
    host.appendChild(c);
  }
  applySpin(host);
}

/* ── 2. 쓸어서 섞기 — 두세 번이면 족하다 ── */
function brush(el){
  if(!el || !el.classList.contains("card")) return;
  if(el.classList.contains("lift") || el.classList.contains("off")) return;
  el.classList.add("lift");
  setTimeout(() => el.classList.remove("lift"), 240);
  [el.previousElementSibling, el.nextElementSibling].forEach(sb => {
    if(!sb || sb.classList.contains("lift") || sb.classList.contains("taken")) return;
    sb.classList.add("nudge");
    setTimeout(() => sb.classList.remove("nudge"), 210);
  });

  el.classList.add("brushed");
  S.brushN++; S.sinceFlip++;

  const n = S.order.length;
  const a = Number(el.dataset.i) % n, b = Math.floor(Math.random() * n);
  [S.order[a], S.order[b]] = [S.order[b], S.order[a]];

  if(S.brushN >= 40) finishSweep();
}

function markPass(){
  S.pass++;
  S.sinceFlip = 0;
  const msg = $("dealmsg");
  if(S.pass === 1) msg.innerHTML = '한 번 더 쓸어라<small>아직 귀신들이 자리를 안 잡았다</small>';
  if(S.pass === 2) msg.innerHTML = '한 번만 더<small>거의 다 흩어졌다</small>';
  if(S.pass >= 3) finishSweep();
}

function finishSweep(){
  if(S.done) return;
  S.done = true;
  const msg = $("dealmsg");
  msg.innerHTML = '흩어졌다<small>패가 네 질문을 물었다</small>';
  const cards = [...$("fan").children].filter(c => !c.classList.contains("off"));
  cards.forEach((c, i) => setTimeout(() => {
    c.classList.add("lift");
    setTimeout(() => c.classList.remove("lift"), 220);
  }, i * 36));
  setTimeout(() => { msg.style.opacity = "0"; }, 1000);
  setTimeout(toPickScreen, 1350);
}

function toPickScreen(){
  buildFan($("fan2"), true);
  if(!pickWired){ wireSpin("fanwrap2", "fan2", false); pickWired = true; }
  show("s-pick");
}
let pickWired = false;

/* ── 돌리기 + 쓸기 ─────────────────────── */
function wireSpin(wrapId, fanId, sweeping){
  const wrap = $(wrapId), fan = $(fanId);
  let x = null, v = 0, raf = null, moved = 0;

  const glide = () => {
    v *= 0.94;
    if(Math.abs(v) < 0.02){ raf = null; fan.classList.remove("spin"); return; }
    S.spin += v; applySpin(fan);
    raf = requestAnimationFrame(glide);
  };

  wrap.addEventListener("pointerdown", e => {
    e.preventDefault();
    x = e.clientX; v = 0; moved = 0;
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    fan.classList.add("spin");
    if(sweeping) brush(document.elementFromPoint(e.clientX, e.clientY));
  });

  wrap.addEventListener("pointermove", e => {
    if(sweeping) brush(document.elementFromPoint(e.clientX, e.clientY));
    if(x === null) return;
    const dx = e.clientX - x;
    if(Math.abs(dx) < 0.5) return;
    moved += Math.abs(dx);
    if(sweeping){
      const dir = Math.sign(dx);
      if(S.dir === 0) S.dir = dir;
      else if(dir !== S.dir && S.sinceFlip >= 5){ S.dir = dir; markPass(); }
    }
    v = dx * 0.14;
    S.spin += v;
    applySpin(fan);
    x = e.clientX;
  });

  ["pointerup","pointercancel","pointerleave"].forEach(ev =>
    wrap.addEventListener(ev, () => {
      if(x === null) return;
      x = null;
      wrap.dataset.moved = moved > 8 ? "1" : "";
      setTimeout(() => { wrap.dataset.moved = ""; }, 80);
      if(Math.abs(v) > 0.1 && !raf) raf = requestAnimationFrame(glide);
      else fan.classList.remove("spin");
    }));
}
wireSpin("fanwrap", "fan", true);

/* ── 3. 뽑기 ────────────────────────────── */
function pick(el){
  if($("fanwrap2").dataset.moved) return;
  if(el.classList.contains("taken") || S.picked.length >= 3) return;
  const slot = S.picked.length;
  const idx = S.order[Number(el.dataset.i) % S.order.length];
  S.picked.push({ card: DECK[idx], rev: Math.random() < 0.38 });
  el.classList.add("taken");
  [...$("pips").children].forEach((d, i) => d.classList.toggle("on", i < S.picked.length));

  if(S.picked.length === 1) $("pickmsg").firstChild.textContent = "둘 더 남았다 ";
  if(S.picked.length === 2) $("pickmsg").firstChild.textContent = "마지막 한 장 ";
  if(S.picked.length === 3){
    $("pickmsg").firstChild.textContent = "세 장이 네 앞에 놓였다 ";
    setTimeout(() => { $("pickmsg").style.opacity = "0"; }, 500);
    setTimeout(openReading, 1000);
  }
}

/* ── 4. 풀이 ────────────────────────────── */
function openReading(){
  const laid = $("laid");
  laid.innerHTML = "";
  S.picked.forEach((p, i) => {
    const slot = document.createElement("div");
    slot.className = "slot" + (i === 2 ? " locked" : "");
    slot.innerHTML = `
      <div class="pos">${POS[i].label}</div>
      <div class="flipper" id="fl${i}">
        <div class="inner">
          <div class="face back"></div>
          <div class="face front${p.rev ? " rev" : ""}">
            ${p.rev ? '<span class="awake">깨 어 남</span>' : ''}
            <div class="art" style="background-image:url('${p.card.art || "img/back.webp"}')"></div>
            <div class="nm">${p.card.nm}(${p.card.jp})<small>${p.card.no} · ${p.card.suit}</small></div>
          </div>
        </div>
      </div>`;
    laid.appendChild(slot);
  });

  $("bg").classList.remove("seer");
  show("s-read");
  $("read").innerHTML = "";
  $("readfoot").innerHTML = "";

  setTimeout(() => $("fl0").classList.add("open"), 500);
  setTimeout(() => $("fl1").classList.add("open"), 1250);
  setTimeout(runReading, 2000);
}

function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
const readBox = () => $("read");
function toBottom(){ const r = readBox(); r.scrollTop = r.scrollHeight; }

/* ── 뜸 들이기 ──────────────────────────── */
async function dots(ms){
  const p = document.createElement("div");
  p.className = "line";
  p.innerHTML = '<span class="dots"><i>·</i><i>·</i><i>·</i></span>';
  readBox().appendChild(p);
  toBottom();
  await wait(950 + Math.random() * 450);
  p.remove();
}

/* ── 한 자씩 뱉기 ───────────────────────── */
async function line(who, html, speed){
  speed = speed || 6;
  const p = document.createElement("div");
  p.className = "line";
  p.innerHTML = (who ? `<span class="who">${who}</span>` : "") + '<span class="body"></span>';
  readBox().appendChild(p);
  const body = p.querySelector(".body");
  let out = "";
  for(let i = 0; i < html.length; i++){
    const ch = html[i];
    if(ch === "<"){
      const j = html.indexOf(">", i);
      out += html.slice(i, j + 1); i = j;
      body.innerHTML = out + '<span class="caret"></span>';
      if(html.slice(j - 3, j + 1) === "<br>") await wait(120);
      continue;
    }
    out += ch;
    body.innerHTML = out + '<span class="caret"></span>';
    toBottom();
    let d = speed * (0.8 + Math.random() * 0.5);
    if(ch === "…") d = 190;
    else if(ch === "." || ch === "?" || ch === "!") d = 95;
    else if(ch === ",") d = 48;
    await wait(d);
  }
  body.innerHTML = out;
  toBottom();
  await wait(90);
  return p;
}

/* ── 풀이 엔진 ──────────────────────────── */
function buildReading(){
  const [a, b, c] = S.picked;
  const topic = (TOPICS.find(t => t.re.test(S.q)) || { k:"기타" }).k;

  /* 오행 우세 */
  const tally = {};
  S.picked.forEach(p => tally[p.card.el] = (tally[p.card.el] || 0) + 1);
  const el = Object.keys(tally).sort((x, y) => tally[y] - tally[x])[0];
  const elCount = tally[el];

  /* 뒤집힌 수 → 확답 등급 */
  const rev = S.picked.filter(p => p.rev).length;
  const verdict = TOPIC_VERDICT[topic][Math.min(rev, 3)];

  /* 붙은 귀 — 대귀가 있으면 대귀, 없으면 뒤집힌 귀, 그도 없으면 과(果) 자리 */
  const gui = S.picked.find(p => p.card.suit === "대귀")
           || S.picked.find(p => p.rev)
           || c;

  /* 갈래 쏠림 */
  const suits = S.picked.map(p => p.card.suit);
  const leanSuit = suits.find((s, i) => suits.indexOf(s) !== i) || null;

  return { topic, el, elCount, rev, verdict, gui, leanSuit,
           when: EL_WHEN[el], tie: TOPIC_TIE[topic] };
}

function revTail(p){
  return p.rev ? " 게다가 이 귀는 지금 <strong>깨어 있다</strong>. 그래서 더 빠르게, 더 세게 온다." : "";
}

/* ── 무료 구간 ──────────────────────────── */
async function runReading(){
  const E = buildReading();
  S.E = E;

  await dots(1600);
  await line("원광", `네가 물은 것은… <em>“${esc(S.q)}”</em> 이것이로구나.`);
  await dots(1400);
  await line("", `패가 셋 나왔다.<br>먼저 뿌리와 얽힘, 둘만 보여주마.`);

  for(let i = 0; i < 2; i++){
    const p = S.picked[i];
    await dots(1500);
    await line(POS[i].label,
      `<em>${p.card.nm}(${p.card.jp})</em> · ${p.card.no} ${p.card.suit}<br>` +
      p.card[POS[i].key] + revTail(p));
  }

  await dots(1200);
  await line("", `${E.tie}<br>그런데 마지막 한 장이… 좋지 않다.`);

  await wait(300);
  const seal = document.createElement("div");
  seal.className = "seal";
  seal.innerHTML = `
    <p class="why">과(果)는 아직 덮여 있다.</p>
    <p class="blur">이 일은 ○○ 안에 갈린다. 네가 지금 붙들고 있는 그것을 놓으면 돌아오고, 쥐고 있으면 그대로 끝난다. 그리고 네 뒤에 붙은 귀는 ○○이다. 그 귀가 왜 하필 네게 붙었는지, 어떻게 떼는지는…</p>
    <p class="price">결과 · 시기 · 확답 · 네게 붙은 귀 · 떼는 법 — 1,900원</p>
    <button class="btn" id="pay">봉 인 을 풀 다</button>`;
  readBox().appendChild(seal);
  toBottom();

  $("pay").addEventListener("click", unseal, { once:true });
  $("readfoot").innerHTML = `<button class="btn ghost" id="again">다 시 묻 다</button>`;
  $("again").addEventListener("click", reset);
}

/* ── 유료 구간 — 여기서 전부 끝낸다 ─────── */
async function unseal(){
  S.paid = true;
  const E = S.E;
  document.querySelector(".seal").remove();
  $("readfoot").innerHTML = "";
  document.querySelectorAll(".slot")[2].classList.remove("locked");
  $("fl2").classList.add("open");
  await wait(750);

  const p = S.picked[2];
  await line(POS[2].label,
    `<em>${p.card.nm}(${p.card.jp})</em> · ${p.card.no} ${p.card.suit}<br>` +
    p.card["果"] + revTail(p));

  await dots(1600);
  await line("시기",
    `세 장에 <em>${E.el}</em> 기운이 ${E.elCount === 3 ? "셋 다" : E.elCount + "장이나"} 몰렸다. ` +
    `${E.when.d}.<br>갈리는 때는 <strong>${E.when.t}</strong>이다. 그 안에 반드시 한 번 움직인다.`);

  await dots(1700);
  await line("확답", `<strong>${E.verdict}</strong>`);

  await dots(1800);
  await line("붙은 귀",
    `네 뒤에 붙은 것은 <em>${E.gui.card.nm}(${E.gui.card.jp})</em>, ${E.gui.card.hanja}다.<br>` +
    E.gui.card.why);

  await dots(1500);
  await line("떼는 법", E.gui.card.fix);

  if(E.leanSuit){
    await dots(1300);
    await line("한 가지 더",
      `세 장 중 둘이 <em>${E.leanSuit}</em>에서 나왔다. 한쪽으로 쏠린 패다. ` +
      `이건 네 문제가 한 군데에 몰려 있다는 뜻이다. 거기만 손보면 나머지는 따라온다.`);
  }

  await dots(1400);
  await line("원광",
    `${E.rev === 0 ? "뒤집힌 귀가 하나도 없다. 흐름이 네 편이다." :
      E.rev === 3 ? "셋 다 뒤집혔다. 지금 네 자리가 통째로 흔들리고 있다는 뜻이다." :
      `${E.rev}장이 뒤집혀 나왔다. 순순히 가지는 않는다는 뜻이다.`}<br>` +
    `다만 패는 끝을 이미 정해뒀다… <strong>${E.when.t}</strong>, 그때 네가 어느 손을 쓰느냐만 남았다.`);

  const tail = document.createElement("p");
  tail.className = "tail";
  tail.innerHTML = `이 풀이는 <b>${new Date().toLocaleDateString("ko-KR")}</b>의 패다.<br>같은 질문을 다시 물으면 패가 달라진다.`;
  readBox().appendChild(tail);
  toBottom();

  $("readfoot").innerHTML = `<button class="btn ghost" id="again2">다 른 것 을 묻 다</button>`;
  $("again2").addEventListener("click", reset);
}

function reset(){
  S.q = ""; S.order = []; S.picked = []; S.shuffles = 0; S.paid = false; S.E = null; S.spin = 0;
  S.brushN = 0; S.pass = 0; S.dir = 0; S.sinceFlip = 0;
  S.swept = new Set();
  q.value = "";
  $("count").textContent = "0 / 120";
  $("go").disabled = true;
  $("bg").classList.remove("seer");
  S.done = false;
  const dm = $("dealmsg"), pm = $("pickmsg");
  delete dm.dataset.near;
  dm.style.opacity = ""; pm.style.opacity = "";
  dm.innerHTML = '패를 손으로 쓸어 흩어라<small>백 귀신이 네 질문을 받아 간다</small>';
  pm.innerHTML = '손이 멎는 자리가 네 패다\n      <small>인(因) · 연(緣) · 과(果) 세 장</small>\n      <span class="pips" id="pips"><i></i><i></i><i></i></span>';
  show("s-ask");
}
